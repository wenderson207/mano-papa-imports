<style>
  .badge{ display:inline-flex; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; font-family:var(--font-mono); }
  .badge.danger{ background:rgba(255,92,92,0.12); color:var(--red); }
</style>

<div class="toolbar"><div><h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 4px;">Divergências de Estoque</h1>
<p style="color:var(--text-secondary); font-size:13px; margin:0;">Toda vez que alguém vende mais do que tinha em estoque (e confirma mesmo assim), fica registrado aqui.</p></div></div>

<div class="kpi-grid" id="kpiGrid">
  <div class="kpi"><div class="lbl">Total de ocorrências</div><div class="val">—</div></div>
  <div class="kpi"><div class="lbl">Unidades vendidas a mais</div><div class="val">—</div></div>
</div>

<table class="dt">
  <thead><tr><th>Data/Hora</th><th>Produto</th><th>Loja</th><th>Tinha em estoque</th><th>Vendeu</th><th>Diferença</th><th>Quem vendeu</th></tr></thead>
  <tbody id="linhas"><tr class="empty-row"><td colspan="7">Carregando…</td></tr></tbody>
</table>

<script>
(async function(){
  function dataHoraBR(v){ return v ? new Date(v).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; }

  try {
    if (!(await checarPermissao('ESTOQUE','VISUALIZAR'))){ setHTML('linhas', '<tr class="empty-row"><td colspan="7">Sem permissão.</td></tr>'); return; }

    const [divergencias, empresas, usuarios] = await Promise.all([dbGetAll('DIVERGENCIAS_ESTOQUE'), dbGetAll('EMPRESAS'), dbGetAll('USUARIOS')]);
    function nomeLoja(id){ if (!id) return '—'; const e = empresas.find(x=>x.ID===id); return e?e.NOME:'—'; }
    function nomeUsuario(id){ const u = usuarios.find(x=>x.ID===id); return u?u.NOME:(id||'—'); }

    const ordenadas = divergencias.sort((a,b) => new Date(b.DATA) - new Date(a.DATA));

    const kpis = document.querySelectorAll('#kpiGrid .kpi .val');
    kpis[0].textContent = ordenadas.length;
    kpis[1].textContent = ordenadas.reduce((s,d) => s + Number(d.DIFERENCA||0), 0);

    setHTML('linhas', ordenadas.length ? ordenadas.map(d => `<tr>
      <td>${dataHoraBR(d.DATA)}</td><td><b>${d.NOME_PRODUTO}</b></td><td>${nomeLoja(d.EMPRESA_ID)}</td>
      <td>${d.ESTOQUE_DISPONIVEL}</td><td>${d.QUANTIDADE_SOLICITADA}</td>
      <td><span class="badge danger">+${d.DIFERENCA}</span></td><td>${nomeUsuario(d.USUARIO_ID)}</td>
      </tr>`).join('') : '<tr class="empty-row"><td colspan="7">Nenhuma divergência registrada — tudo dentro do estoque até agora. 🎉</td></tr>');
  } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
})();
</script>
