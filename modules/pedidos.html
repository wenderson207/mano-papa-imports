<style>
  .modal-overlay{ position:fixed; inset:0; background:rgba(3,5,8,0.6); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:14px; width:100%; max-width:480px; }
  .modal-head{ display:flex; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--hairline); }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--hairline); }
  .modal-close{ background:none; border:none; color:var(--text-tertiary); font-size:18px; cursor:pointer; }
  .ffield{ margin-bottom:14px; }
  .ffield label{ display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .ffield input, .ffield textarea, .ffield select{ width:100%; background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:10px 12px; border-radius:8px; font-size:13px; font-family:inherit; box-sizing:border-box; }
  .frow2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .frow3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:700px){ .frow3{ grid-template-columns:1fr 1fr; } }

  /* Layout tipo "Notas" — lista de listas à esquerda, conteúdo à direita */
  .pedidos-wrap{ display:grid; grid-template-columns:260px 1fr; gap:20px; align-items:start; }
  @media (max-width:860px){ .pedidos-wrap{ grid-template-columns:1fr; } }
  .listas-coluna{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:12px; padding:10px; max-height:70vh; overflow-y:auto; }
  .lista-item{ padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:4px; }
  .lista-item:hover{ background:var(--bg-elevated); }
  .lista-item.ativa{ background:rgba(47,225,168,0.1); border:1px solid var(--mint); }
  .lista-item .nome{ font-size:13px; font-weight:600; }
  .lista-item .meta{ font-size:11px; color:var(--text-tertiary); margin-top:2px; }
  .conteudo-lista{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:12px; padding:18px 20px; min-height:300px; }
  .filtros-pedido{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; }
  .filtros-pedido .grupo{ display:flex; flex-direction:column; gap:4px; }
  .filtros-pedido .grupo span{ font-size:10.5px; color:var(--text-tertiary); }
  .filtros-pedido select{ background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:8px 12px; border-radius:8px; font-size:12.5px; }
</style>

<div class="toolbar">
  <div><h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 4px;">Pedidos — Listas de Compras</h1>
  <p style="color:var(--text-secondary); font-size:13px; margin:0;">Cada lista fica salva separada — igual o app de Notas. Cria quantas quiser, e só apaga quando você mandar.</p></div>
  <button class="btn btn-primary" id="btnNovaLista">+ Nova lista</button>
</div>

<div class="pedidos-wrap">
  <div class="listas-coluna" id="colunaListas"><div style="color:var(--text-tertiary); font-size:12px; padding:10px;">Carregando…</div></div>

  <div class="conteudo-lista" id="conteudoLista">
    <div style="color:var(--text-tertiary); font-size:13px; text-align:center; padding:60px 20px;">Escolhe uma lista ao lado, ou cria uma nova pra começar.</div>
  </div>
</div>

<div class="modal-overlay" id="modalNovaLista">
  <div class="modal-box" style="max-width:400px;">
    <div class="modal-head"><h3 style="font-family:var(--font-display); margin:0;">Nova lista</h3><button class="modal-close" id="fecharModalNovaLista">✕</button></div>
    <div class="modal-body">
      <div class="ffield"><label>Nome da lista</label><input id="fNomeLista" placeholder="Ex.: Pedido pro fornecedor, Compras de setembro…"></div>
    </div>
    <div class="modal-foot"><button class="btn" id="btnCancelarNovaLista">Cancelar</button><button class="btn btn-primary" id="btnCriarLista">Criar</button></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitulo" style="font-family:var(--font-display); margin:0;">Adicionar item</h3><button class="modal-close" id="fecharModal">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="fId">
      <div class="frow2">
        <div class="ffield"><label>Produto / descrição *</label><input id="fDescricao" placeholder="Ex.: Capinha, Tela, Bateria…"></div>
        <div class="ffield"><label>Quantidade *</label><input id="fQuantidade" type="number" min="1" value="1"></div>
      </div>
      <div class="frow2">
        <div class="ffield"><label>Categoria</label><input id="fCategoria" placeholder="Ex.: Capinhas, Telas, Fones…" list="listaCategoriasSugeridas"><datalist id="listaCategoriasSugeridas"></datalist></div>
        <div class="ffield"><label>Modelo / aparelho</label><input id="fModelo" placeholder="Ex.: iPhone 11, Samsung A23…"></div>
      </div>
      <div class="ffield"><label>Cor</label><input id="fCor" placeholder="Ex.: Preta, Verde Musgo…"></div>
      <div class="ffield"><label>Observação</label><textarea id="fObservacao" style="min-height:60px;" placeholder="Qualquer outro detalhe — fornecedor, referência, etc."></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" id="btnCancelar">Cancelar</button><button class="btn btn-primary" id="btnSalvar">Salvar</button></div>
  </div>
</div>

<script>
(async function(){
  let listas = [], itensDaListaAtiva = [], listaAtivaId = null, itemAtual = null;

  function dataHoraBR(v){ return v ? new Date(v).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; }
  function dataBR(v){ return v ? new Date(v).toLocaleDateString('pt-BR') : '—'; }

  async function carregarListas(){
    try {
      if (!(await checarPermissao('ESTOQUE','VISUALIZAR'))){ setHTML('colunaListas', 'Sem permissão.'); return; }
      listas = (await dbGetAll('LISTAS_COMPRAS')).sort((a,b) => new Date(b.DATA_CRIACAO) - new Date(a.DATA_CRIACAO));
      renderColunaListas();
      // Se a lista que estava aberta ainda existe, mantém ela aberta depois de recarregar.
      if (listaAtivaId && listas.some(l => l.ID === listaAtivaId)) await abrirLista(listaAtivaId);
      else if (listas.length) await abrirLista(listas[0].ID);
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  }

  function renderColunaListas(){
    if (!listas.length){ setHTML('colunaListas', '<div style="color:var(--text-tertiary); font-size:12px; padding:10px;">Nenhuma lista ainda — cria a primeira.</div>'); return; }
    setHTML('colunaListas', listas.map(l => `<div class="lista-item ${l.ID===listaAtivaId?'ativa':''}" onclick="window.__abrirListaClick('${l.ID}')">
      <div class="nome">${l.NOME}</div>
      <div class="meta">${dataBR(l.DATA_CRIACAO)}</div>
    </div>`).join(''));
  }
  window.__abrirListaClick = (id) => abrirLista(id);

  async function abrirLista(id){
    listaAtivaId = id;
    renderColunaListas();
    const lista = listas.find(l => l.ID === id);
    if (!lista) return;
    try {
      itensDaListaAtiva = (await dbQuery('LISTA_COMPRAS', { LISTA_ID: id })).sort((a,b) => new Date(a.DATA_ADICIONADO) - new Date(b.DATA_ADICIONADO));
      renderConteudoLista(lista);
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  }

  function renderConteudoLista(lista){
    const categorias = [...new Set(itensDaListaAtiva.map(i => i.CATEGORIA).filter(Boolean))];
    setHTML('conteudoLista', `
      <div class="toolbar" style="margin-bottom:6px;">
        <div><h3 style="font-family:var(--font-display); font-size:17px; margin:0;">${lista.NOME}</h3></div>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="btnExcluirLista">🗑️ Excluir lista</button>
          <button class="btn" id="btnImprimirLista">🖨️ Imprimir</button>
          <button class="btn btn-primary" id="btnNovoItem">+ Item</button>
        </div>
      </div>
      <div class="filtros-pedido">
        <div class="grupo"><span>Categoria</span>
          <select id="filtroCategoriaPedido"><option value="">Todas</option>${categorias.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
      </div>
      <div class="kpi-grid" style="margin-bottom:18px;">
        <div class="kpi"><div class="lbl">Itens</div><div class="val" id="kpiItens">—</div></div>
        <div class="kpi"><div class="lbl">Quantidade total</div><div class="val" id="kpiQuantidade">—</div></div>
      </div>
      <table class="dt">
        <thead><tr><th>Produto</th><th>Categoria</th><th>Qtd.</th><th>Modelo</th><th>Cor</th><th>Observação</th><th></th></tr></thead>
        <tbody id="linhasItens"></tbody>
      </table>
    `);

    document.getElementById('filtroCategoriaPedido').addEventListener('change', renderTabelaItens);
    document.getElementById('btnNovoItem').addEventListener('click', abrirModalNovoItem);
    document.getElementById('btnExcluirLista').addEventListener('click', () => excluirLista(lista.ID));
    document.getElementById('btnImprimirLista').addEventListener('click', () => imprimirLista(lista));

    renderTabelaItens();
  }

  function renderTabelaItens(){
    const filtroCategoria = document.getElementById('filtroCategoriaPedido').value;
    const itensFiltrados = filtroCategoria ? itensDaListaAtiva.filter(i => i.CATEGORIA === filtroCategoria) : itensDaListaAtiva;

    document.getElementById('kpiItens').textContent = itensFiltrados.length;
    document.getElementById('kpiQuantidade').textContent = itensFiltrados.reduce((s,i) => s + (Number(i.QUANTIDADE)||0), 0);

    setHTML('linhasItens', itensFiltrados.length ? itensFiltrados.map(i => `<tr>
      <td><b>${i.DESCRICAO}</b></td><td>${i.CATEGORIA||'—'}</td><td>${i.QUANTIDADE}</td><td>${i.MODELO||'—'}</td><td>${i.COR||'—'}</td>
      <td style="max-width:200px; white-space:normal;">${i.OBSERVACAO||'—'}</td>
      <td style="display:flex; gap:6px;">
        <button class="btn" style="padding:6px 10px; font-size:11.5px;" onclick="window.__editarItemPedido('${i.ID}')">Editar</button>
        <button class="btn" style="padding:6px 10px; font-size:11.5px; color:var(--red);" onclick="window.__excluirItemPedido('${i.ID}')">Excluir</button>
      </td>
      </tr>`).join('') : '<tr class="empty-row"><td colspan="7">Nenhum item aqui ainda.</td></tr>');
  }

  // ---------- Criar nova lista ----------
  const modalNovaLista = document.getElementById('modalNovaLista');
  document.getElementById('btnNovaLista').addEventListener('click', () => {
    document.getElementById('fNomeLista').value = '';
    modalNovaLista.classList.add('open');
    setTimeout(() => document.getElementById('fNomeLista').focus(), 50);
  });
  document.getElementById('fecharModalNovaLista').addEventListener('click', () => modalNovaLista.classList.remove('open'));
  document.getElementById('btnCancelarNovaLista').addEventListener('click', () => modalNovaLista.classList.remove('open'));

  document.getElementById('btnCriarLista').addEventListener('click', async () => {
    const nome = document.getElementById('fNomeLista').value.trim();
    if (!nome){ mostrarToast('Dá um nome pra lista.', 'erro'); return; }
    try {
      if (!(await checarPermissao('ESTOQUE','CADASTRAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
      const nova = await dbInsert('LISTAS_COMPRAS', { NOME: nome, DATA_CRIACAO: new Date().toISOString(), USUARIO_ID: usuarioAtual.ID });
      mostrarToast('Lista criada.');
      modalNovaLista.classList.remove('open');
      listaAtivaId = nova.ID;
      await carregarListas();
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  });

  async function excluirLista(listaId){
    const lista = listas.find(l => l.ID === listaId);
    if (!confirm('Excluir a lista "' + (lista?lista.NOME:'') + '" e todos os itens dela? Não dá pra desfazer.')) return;
    try {
      if (!(await checarPermissao('ESTOQUE','EXCLUIR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
      const itens = await dbQuery('LISTA_COMPRAS', { LISTA_ID: listaId });
      for (const item of itens) await dbDelete('LISTA_COMPRAS', item.ID);
      await dbDelete('LISTAS_COMPRAS', listaId);
      mostrarToast('Lista excluída.');
      listaAtivaId = null;
      await carregarListas();
      if (!listas.length) setHTML('conteudoLista', '<div style="color:var(--text-tertiary); font-size:13px; text-align:center; padding:60px 20px;">Escolhe uma lista ao lado, ou cria uma nova pra começar.</div>');
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  }

  // ---------- Item: adicionar/editar/excluir ----------
  const modal = document.getElementById('modal');
  function abrirModalNovoItem(){
    itemAtual = null;
    document.getElementById('modalTitulo').textContent = 'Adicionar item';
    document.getElementById('fId').value = '';
    document.getElementById('fDescricao').value = '';
    document.getElementById('fQuantidade').value = '1';
    document.getElementById('fCategoria').value = '';
    document.getElementById('fModelo').value = '';
    document.getElementById('fCor').value = '';
    document.getElementById('fObservacao').value = '';
    const categoriasExistentes = [...new Set(itensDaListaAtiva.map(i => i.CATEGORIA).filter(Boolean))];
    setHTML('listaCategoriasSugeridas', categoriasExistentes.map(c => `<option value="${c}">`).join(''));
    modal.classList.add('open');
    setTimeout(() => document.getElementById('fDescricao').focus(), 50);
  }
  document.getElementById('fecharModal').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('btnCancelar').addEventListener('click', () => modal.classList.remove('open'));

  window.__editarItemPedido = (id) => {
    itemAtual = itensDaListaAtiva.find(i => i.ID === id);
    if (!itemAtual) return;
    document.getElementById('modalTitulo').textContent = 'Editar item';
    document.getElementById('fId').value = itemAtual.ID;
    document.getElementById('fDescricao').value = itemAtual.DESCRICAO || '';
    document.getElementById('fQuantidade').value = itemAtual.QUANTIDADE || 1;
    document.getElementById('fCategoria').value = itemAtual.CATEGORIA || '';
    document.getElementById('fModelo').value = itemAtual.MODELO || '';
    document.getElementById('fCor').value = itemAtual.COR || '';
    document.getElementById('fObservacao').value = itemAtual.OBSERVACAO || '';
    modal.classList.add('open');
  };

  document.getElementById('btnSalvar').addEventListener('click', async () => {
    const descricao = document.getElementById('fDescricao').value.trim();
    const quantidade = Number(document.getElementById('fQuantidade').value) || 1;
    if (!descricao){ mostrarToast('Descreve o produto que precisa comprar.', 'erro'); return; }

    const dados = {
      DESCRICAO: descricao, QUANTIDADE: quantidade,
      CATEGORIA: document.getElementById('fCategoria').value.trim(),
      MODELO: document.getElementById('fModelo').value.trim(),
      COR: document.getElementById('fCor').value.trim(),
      OBSERVACAO: document.getElementById('fObservacao').value.trim()
    };

    try {
      if (itemAtual) {
        if (!(await checarPermissao('ESTOQUE','EDITAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
        await dbUpdate('LISTA_COMPRAS', itemAtual.ID, dados);
      } else {
        if (!(await checarPermissao('ESTOQUE','CADASTRAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
        await dbInsert('LISTA_COMPRAS', Object.assign({ LISTA_ID: listaAtivaId, DATA_ADICIONADO: new Date().toISOString(), USUARIO_ID: usuarioAtual.ID }, dados));
      }
      mostrarToast('Item salvo.');
      modal.classList.remove('open');
      await abrirLista(listaAtivaId);
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  });

  window.__excluirItemPedido = async (id) => {
    if (!confirm('Remover esse item da lista?')) return;
    try {
      if (!(await checarPermissao('ESTOQUE','EXCLUIR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
      await dbDelete('LISTA_COMPRAS', id);
      mostrarToast('Item removido.');
      await abrirLista(listaAtivaId);
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  };

  // ---------- Imprimir (não apaga mais nada — só gera o PDF) ----------
  async function imprimirLista(lista){
    if (!itensDaListaAtiva.length){ mostrarToast('Essa lista está vazia — nada pra imprimir.', 'erro'); return; }
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'mm', format:'a4' });

      doc.setFontSize(16); doc.setFont(undefined,'bold'); doc.setTextColor(226,64,28);
      doc.text(lista.NOME, 15, 18);
      doc.setFontSize(9.5); doc.setFont(undefined,'normal'); doc.setTextColor(120);
      doc.text('Impressa em ' + new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }), 15, 24);
      doc.setTextColor(20);

      let y = 34;
      doc.setDrawColor(200); doc.setFontSize(9); doc.setFont(undefined,'bold');
      doc.text('Produto', 15, y); doc.text('Cat.', 90, y); doc.text('Qtd.', 115, y); doc.text('Modelo', 130, y); doc.text('Cor', 160, y); doc.text('Obs.', 178, y);
      y += 2; doc.line(15, y, 195, y); y += 6;

      doc.setFont(undefined,'normal'); doc.setFontSize(9);
      itensDaListaAtiva.forEach(i => {
        if (y > 275) { doc.addPage(); y = 20; }
        doc.setFont(undefined,'bold'); doc.text(String(i.DESCRICAO).substring(0,38), 15, y); doc.setFont(undefined,'normal');
        doc.text(String(i.CATEGORIA||'—').substring(0,12), 90, y);
        doc.text(String(i.QUANTIDADE), 115, y);
        doc.text(String(i.MODELO||'—').substring(0,15), 130, y);
        doc.text(String(i.COR||'—').substring(0,10), 160, y);
        const obs = doc.splitTextToSize(String(i.OBSERVACAO||'—'), 20);
        doc.text(obs[0]||'—', 178, y);
        y += 6;
      });

      y += 6;
      doc.setDrawColor(180); doc.line(15, y, 195, y); y += 6;
      doc.setFontSize(9); doc.setFont(undefined,'bold');
      doc.text('Total de itens: ' + itensDaListaAtiva.length + '   |   Quantidade total: ' + itensDaListaAtiva.reduce((s,i)=>s+(Number(i.QUANTIDADE)||0),0), 15, y);

      doc.save(lista.NOME.replace(/[^\w\s-]/g,'') + '.pdf');
      mostrarToast('PDF gerado. A lista continua salva — exclua manualmente quando terminar.');
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  }

  carregarListas();
})();
</script>
